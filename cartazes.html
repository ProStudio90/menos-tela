<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartazes com QR code</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --accent: #2f7d5b; --ink: #1f2a24; --muted: #5b6760; --soft: #e2f0e8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e6dc; color: var(--ink); font-family: "Nunito", system-ui, sans-serif; }
  .toolbar { max-width: 800px; margin: 0 auto; padding: 16px; }
  .toolbar button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 800; cursor: pointer; }
  .warn { background: #fdeedd; border: 2px solid #e8893a; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
  .poster { width: 210mm; height: 297mm; margin: 16px auto; background: #fff; padding: 18mm 16mm; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
  .poster .kicker { text-transform: uppercase; letter-spacing: .15em; font-weight: 800; color: var(--accent); font-size: 14pt; }
  .poster h1 { font-family: "Fraunces", Georgia, serif; font-size: 44pt; line-height: 1.05; margin: 6mm 0 4mm; }
  .poster p.sub { font-size: 17pt; color: var(--muted); margin: 0; }
  .qrbox { background: var(--soft); border-radius: 10mm; padding: 10mm; }
  .qr { background: #fff; padding: 6mm; border-radius: 4mm; }
  .qr svg { display: block; width: 95mm; height: 95mm; shape-rendering: crispEdges; }
  .scan { font-size: 20pt; font-weight: 800; margin-top: 6mm; }
  .foot { font-size: 11pt; color: var(--muted); }
  .foot .url { font-family: monospace; font-size: 9pt; word-break: break-all; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .poster { margin: 0; box-shadow: none; page-break-after: always; }
    @page { size: A4; margin: 0; }
  }
  @media (max-width: 820px) { .poster { transform: scale(.45); transform-origin: top center; margin-bottom: -150mm; } }
</style>
</head>
<body>
<div class="toolbar">
  <div id="aviso"></div>
  <button onclick="window.print()">Imprimir / salvar PDF (um cartaz por cidade)</button>
</div>
<div id="cartazes"></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  var cfg = window.PANFLETO_CONFIG;
  var base = cfg.siteUrl || (location.href.split("cartazes.html")[0]);
  if (!cfg.siteUrl) {
    document.getElementById("aviso").innerHTML = '<div class="warn"><b>Atenção:</b> o endereço do site ainda não foi definido em <code>config.js</code> (siteUrl). Os QR codes abaixo apontam para <code>' + base + '</code> e <b>não vão funcionar</b> no celular de outras pessoas. Publique o site e preencha o siteUrl antes de imprimir.</div>';
  }
  var box = document.getElementById("cartazes");
  Object.keys(cfg.cidades).forEach(function (cod) {
    var url = base + "?c=" + encodeURIComponent(cod);
    var el = document.createElement("section");
    el.className = "poster";
    el.innerHTML =
      '<div><div class="kicker">Menos tela, mais vida</div>' +
      '<h1>Quanto tempo você passou na tela hoje?</h1>' +
      '<p class="sub">Um panfleto de 2 minutos sobre celular, sono e bem-estar.</p></div>' +
      '<div><div class="qrbox"><div class="qr"></div></div><div class="scan">Aponte a câmera do celular 📱</div></div>' +
      '<div class="foot"><b>Projeto Integrador II — Psicologia UCEFF</b> · ' + cfg.cidades[cod] +
      '<br>Acesso anônimo, sem cadastro.<br><span class="url">' + url + '</span></div>';
    box.appendChild(el);
    // QR vetorial (SVG): fica nítido em qualquer tamanho de impressão
    var qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    el.querySelector(".qr").innerHTML = qr.createSvgTag({ cellSize: 10, margin: 0, scalable: true });
  });
</script>
</body>
</html>
