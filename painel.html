<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de acessos</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 760px; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  td.num { font-variant-numeric: tabular-nums; font-weight: 800; }
  tr.total td { border-top: 2px solid var(--ink); border-bottom: 0; }
  tr.fora td { color: var(--muted); font-weight: 400; }
  .bar { height: 8px; border-radius: 4px; background: var(--accent); margin-top: 4px; }
  .meta { color: var(--muted); font-size: .85rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .tag { display: inline-block; background: var(--warm-soft); color: var(--ink); border-radius: 999px; padding: 2px 10px; font-size: .75rem; font-weight: 800; }
  .scroll { overflow-x: auto; }
  .btn { width: auto; display: inline-block; padding: 10px 20px; font-size: .95rem; margin: 0; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="kicker">Projeto Integrador II · Painel</div>
    <h1>Acessos por cidade</h1>
    <p class="meta"><span id="status">Carregando…</span><span id="modo"></span></p>
  </header>

  <section class="card">
    <h2>Quantos abriram o panfleto</h2>
    <div id="barras"></div>
  </section>

  <section class="card scroll">
    <h2>Detalhe</h2>
    <table>
      <thead><tr><th>Cidade</th><th>Abriu o panfleto</th><th>Foi à página 2</th><th>Continuidade</th></tr></thead>
      <tbody id="tabela"></tbody>
    </table>
    <p class="meta" style="margin-top:12px">Continuidade = página 2 ÷ panfleto. "Sem QR" = acessos pelo link direto, sem passar por um QR (ficam fora do total).</p>
  </section>

  <button class="btn" onclick="carregar()">Atualizar agora</button>
  <button class="btn secondary" onclick="baixarCSV()">Baixar CSV</button>
</main>

<script src="config.js"></script>
<script>
  var cfg = window.PANFLETO_CONFIG;
  var API = "https://abacus.jasoncameron.dev";
  var teste = /^(localhost|127\.0\.0\.1|)$/.test(location.hostname) || new URLSearchParams(location.search).has("teste");
  var ns = cfg.contador + (teste ? "-teste" : "");
  var etapas = ["1-panfleto", "2-saiba-mais"];
  var ultimo = [];
  document.getElementById("modo").innerHTML = teste ? '<span class="tag">Contador de TESTE</span>' : "";

  function valor(chave) {
    return fetch(API + "/get/" + encodeURIComponent(ns) + "/" + encodeURIComponent(chave))
      .then(function (r) { return r.ok ? r.json() : { value: 0 }; })
      .then(function (j) { return j.value || 0; })
      .catch(function () { return null; });
  }
  function pct(a, b) { return b ? Math.round(100 * a / b) + "%" : "—"; }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

  function carregar() {
    var codigos = Object.keys(cfg.cidades).concat(["sem-qr"]);
    var pedidos = [];
    codigos.forEach(function (c) { etapas.forEach(function (e) { pedidos.push(valor(c + "_" + e)); }); });
    Promise.all(pedidos).then(function (v) {
      if (v.some(function (x) { return x === null; })) {
        document.getElementById("status").textContent = "Não foi possível falar com o contador. Tente de novo em instantes.";
        return;
      }
      var linhas = codigos.map(function (c, i) {
        return { cod: c, nome: cfg.cidades[c] || "Sem QR", p1: v[i * 2], p2: v[i * 2 + 1] };
      });
      ultimo = linhas;
      var cidades = linhas.filter(function (l) { return l.cod !== "sem-qr"; });
      var tot = cidades.reduce(function (a, l) { return { p1: a.p1 + l.p1, p2: a.p2 + l.p2 }; }, { p1: 0, p2: 0 });
      var max = Math.max.apply(null, cidades.map(function (l) { return l.p1; }).concat([1]));

      document.getElementById("barras").innerHTML = cidades.map(function (l) {
        return '<div style="margin:10px 0"><div class="meta" style="color:var(--ink)"><b>' + esc(l.nome) + '</b><span class="num"><b>' + l.p1 + '</b></span></div>' +
               '<div class="bar" style="width:' + Math.max(2, 100 * l.p1 / max) + '%"></div></div>';
      }).join("");

      function tr(l, cls) {
        return '<tr class="' + (cls || "") + '"><td>' + esc(l.nome) + '</td><td class="num">' + l.p1 + '</td><td class="num">' + l.p2 +
               '</td><td class="num">' + pct(l.p2, l.p1) + '</td></tr>';
      }
      document.getElementById("tabela").innerHTML =
        cidades.map(function (l) { return tr(l); }).join("") +
        tr({ nome: "Total (3 cidades)", p1: tot.p1, p2: tot.p2 }, "total") +
        tr(linhas[linhas.length - 1], "fora");
      document.getElementById("status").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR") + " · atualiza sozinho a cada 30 s";
    });
  }

  function baixarCSV() {
    var csv = "cidade;abriu_panfleto;pagina_2;continuidade\n" + ultimo.map(function (l) {
      return [l.nome, l.p1, l.p2, pct(l.p2, l.p1)].join(";");
    }).join("\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
    a.download = "acessos-por-cidade-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
  }

  carregar();
  setInterval(carregar, 30000);
</script>
</body>
</html>
